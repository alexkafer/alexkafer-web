name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # One run per ref. PRs cancel previous runs; main does not (avoid half-deploys).
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build OpenNext bundle
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run cf:build

      # ─── Production: push to main ────────────────────────────────
      - name: Apply D1 migrations (production)
        if: github.event_name == 'push'
        run: npx wrangler d1 migrations apply alexkafer-ab --remote

      - name: Deploy to production Worker
        if: github.event_name == 'push'
        run: npx wrangler deploy --var NEXT_PUBLIC_BUILD_SHA:${{ github.sha }}

      # ─── Preview: pull request ──────────────────────────────────
      - name: Upload preview version
        id: preview
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          npx wrangler versions upload \
            --message "PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA::7}" \
            --tag "pr-${{ github.event.pull_request.number }}" \
            --var NEXT_PUBLIC_BUILD_SHA:${{ github.sha }} \
            2>&1 | tee /tmp/wrangler.out
          URL=$(grep -Eo 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' /tmp/wrangler.out | tail -1)
          if [[ -z "$URL" ]]; then
            echo "::error::Could not parse preview URL from wrangler output"
            exit 1
          fi
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "✨ Preview: $URL"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- cf-preview-bot -->';
            const url = process.env.PREVIEW_URL;
            const sha = context.sha.substring(0, 7);
            const body = [
              marker,
              '### 🚀 Cloudflare Worker preview',
              '',
              `| | |`,
              `|---|---|`,
              `| **Preview URL** | ${url} |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Updated** | <samp>${new Date().toISOString()}</samp> |`,
              '',
              '_Previews share the production `alexkafer-ab` D1 — A/B events from this branch will affect prod stats._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
